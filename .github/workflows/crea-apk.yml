name: Crea APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installa dipendenze
        run: npm ci
      - name: Prepara il progetto Android
        run: npx cap sync android
      - name: Compila l'APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
          mv app/build/outputs/apk/debug/app-debug.apk ../ControlloAccessi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ControlloAccessi-APK
          path: ControlloAccessi.apk
